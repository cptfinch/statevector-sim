[project]
name = "statevector-sim"
version = "0.1.0"
description = "A small state-vector quantum circuit simulator, written to learn the linear algebra of qubits and gates."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = { text = "MIT" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statevector_sim"]
